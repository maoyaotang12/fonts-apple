<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- ===================== -->
    <!-- Generic Serif         -->
    <!-- ===================== -->

    <alias>
        <family>serif</family>
        <prefer>
            <!-- Latin first -->
            <family>Noto Serif</family>
            <family>DejaVu Serif</family>

            <!-- Apple serif -->
            <family>New York</family>

            <!-- Emoji -->
            <family>Apple Symbols</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- ===================== -->
    <!-- Generic Sans-serif    -->
    <!-- ===================== -->

    <alias>
        <family>sans-serif</family>
        <prefer>
            <!-- Latin first -->
            <family>Noto Sans</family>
            <family>DejaVu Sans</family>

            <!-- Emoji -->
            <family>Apple Symbols</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- ===================== -->
    <!-- Language-specific CJK -->
    <!-- ===================== -->

    <!-- Simplified Chinese -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-cn</string>
        </test>
        <edit name="family" mode="prepend">
            <string>PingFang SC</string>
        </edit>
    </match>

    <!-- Traditional Chinese (Taiwan) -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-tw</string>
        </test>
        <edit name="family" mode="prepend">
            <string>PingFang TC</string>
        </edit>
    </match>

    <!-- Traditional Chinese (Hong Kong) -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-hk</string>
        </test>
        <edit name="family" mode="prepend">
            <string>PingFang HK</string>
        </edit>
    </match>

    <!-- Japanese -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>ja</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Hiragino Mincho ProN</string>
        </edit>
    </match>

    <!-- ===================== -->
    <!-- Monospace             -->
    <!-- ===================== -->

    <alias>
        <family>monospace</family>
        <prefer>
            <!-- Latin monospace first -->
            <family>DejaVu Sans Mono</family>

            <!-- Apple mono -->
            <family>Monaco</family>
            <family>SF Mono</family>

            <!-- Emoji -->
            <family>Apple Symbols</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

</fontconfig>
