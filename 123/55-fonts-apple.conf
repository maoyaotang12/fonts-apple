<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- ===================== -->
    <!-- Serif -->
    <!-- ===================== -->
    <alias>
        <family>serif</family>
        <prefer>
            <family>New York</family>
            <family>PingFang SC</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- ===================== -->
    <!-- Sans -->
    <!-- ===================== -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>SF Pro Display</family>
            <family>PingFang SC</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- ===================== -->
    <!-- Monospace -->
    <!-- ===================== -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>SF Mono</family>
            <family>PingFang SC</family>
            <family>PingFang HK</family>
            <family>PingFang TC</family>
            <family>Hiragino Mincho ProN</family>
            <family>Apple Color Emoji</family>
        </prefer>
    </alias>

    <!-- ===================== -->
    <!-- Language mapping -->
    <!-- ===================== -->

    <!-- zh-CN -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-cn</string>
        </test>
        <edit name="family" mode="prepend">
            <string>PingFang SC</string>
        </edit>
    </match>

    <!-- zh-HK -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-hk</string>
        </test>
        <edit name="family" mode="prepend">
            <string>PingFang HK</string>
        </edit>
    </match>

    <!-- zh-TW -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>zh-tw</string>
        </test>
        <edit name="family" mode="prepend">
            <string>PingFang TC</string>
        </edit>
    </match>

    <!-- Japanese -->
    <match target="pattern">
        <test name="lang" compare="contains">
            <string>ja</string>
        </test>
        <edit name="family" mode="prepend">
            <string>Hiragino Mincho ProN</string>
        </edit>
    </match>

</fontconfig>